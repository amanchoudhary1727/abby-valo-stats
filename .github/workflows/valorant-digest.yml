name: Valorant Session Digest

on:
  schedule:
    - cron: "17 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # Run digest
      # ------------------------------------------------------

      - name: Run Valorant Session Digest
        env:
          VALORANT_API_KEY: ${{ secrets.VALORANT_API_KEY }}
          VALORANT_NAME: ${{ secrets.VALORANT_NAME }}
          VALORANT_TAG: ${{ secrets.VALORANT_TAG }}
          VALORANT_REGION: ${{ secrets.VALORANT_REGION }}
          VALORANT_PLATFORM: ${{ secrets.VALORANT_PLATFORM }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/digest.py

      # ------------------------------------------------------
      # Check whether state.json changed
      # ------------------------------------------------------

      - name: Check state changes
        id: state_changes
        run: |
          if git diff --quiet -- state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No state changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "state.json changed."
          fi

      # ------------------------------------------------------
      # Create session snapshot
      # ------------------------------------------------------

      - name: Create session snapshot
        if: steps.state_changes.outputs.changed == 'true'
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")

          cp state.json "$TIMESTAMP.json"

          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

          echo "Created snapshot: $TIMESTAMP.json"

      # ------------------------------------------------------
      # Install Azure CLI
      # ------------------------------------------------------

      - name: Install Azure CLI
        if: steps.state_changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ------------------------------------------------------
      # Upload snapshot to Azure Blob Storage
      # ------------------------------------------------------

      - name: Upload snapshot to Azure
        if: steps.state_changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --container-name valorant-sessions \
            --file "${TIMESTAMP}.json" \
            --name "${TIMESTAMP}.json"

      # ------------------------------------------------------
      # Commit updated state
      # ------------------------------------------------------

      - name: Commit state
        if: steps.state_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git commit -m "chore: update Valorant session state [skip ci]"

          git push
